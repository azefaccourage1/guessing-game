
<!DOCTYPE html>
<html>
<head>
    <title>Number Guessing Game</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: lightblue;
            padding: 50px;
        }

        .game {
            background: white;
            padding: 25px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
        }

        input, button {
            padding: 10px;
            margin: 10px;
            width: 90%;
        }

        button {
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="game">

        <h2>Number Guessing Game</h2>

        <p>Guess a number between 1 and 100</p>

        <input type="number" id="guess" placeholder="Enter your guess" min="1" max="100">

        <button onclick="checkGuess()">Check Guess</button>

        <h3 id="result">Good luck!</h3>

        <p id="attempts">Attempts: 0</p>

        <button onclick="newGame()">New Game</button>

    </div>

    <script>

        let number = Math.floor(Math.random() * 100) + 1;
        let count = 0;
        let finished = false;

        function checkGuess() {

            let guess = Number(document.getElementById("guess").value);

            if (finished) {
                document.getElementById("result").innerHTML =
                    "Start a new game!";
                return;
            }

            if (guess < 1 || guess > 100 || guess === 0) {
                document.getElementById("result").innerHTML =
                    "Enter a number between 1 and 100";
                return;
            }

            count++;

            if (guess === number) {
                document.getElementById("result").innerHTML =
                    "Congratulations! You won!";
                finished = true;
            }
            else if (guess < number) {
                document.getElementById("result").innerHTML =
                    "Too low! Try again.";
            }
            else {
                document.getElementById("result").innerHTML =
                    "Too high! Try again.";
            }

            document.getElementById("attempts").innerHTML =
                "Attempts: " + count;
        }

        function newGame() {

            number = Math.floor(Math.random() * 100) + 1;
            count = 0;
            finished = false;

            document.getElementById("guess").value = "";
            document.getElementById("result").innerHTML = "Good luck!";
            document.getElementById("attempts").innerHTML = "Attempts: 0";
        }

    </script>

</body>
</html>
